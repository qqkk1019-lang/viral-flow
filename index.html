<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI 短影音工作流</title>
  <style>
    :root{--blue:#155eef;--ink:#15213a;--muted:#637087;--paper:#f4f7fb;--line:#dce4f0;--green:#087e5b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.wrap{max-width:760px;margin:auto;padding:28px 18px 52px}.head{background:linear-gradient(135deg,#112c62,#1d5ece);padding:30px;border-radius:20px;color:#fff}.head h1{margin:0 0 8px;font-size:25px}.head p{margin:0;color:#dce9ff;line-height:1.6}.box{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:22px}.step{display:flex;gap:10px;margin:13px 0;color:var(--muted);font-size:14px}.n{width:25px;height:25px;flex:0 0 25px;display:grid;place-items:center;background:#e8efff;color:var(--blue);border-radius:50%;font-weight:800}label{font-weight:700;font-size:15px;display:block;margin:21px 0 8px}textarea{width:100%;min-height:100px;border:1px solid #bac7da;border-radius:11px;padding:13px;font:inherit;font-size:16px;line-height:1.5;resize:vertical}.row{display:flex;gap:8px;flex-wrap:wrap}.choice{border:1px solid #bfd0ed;background:#fff;color:#34435b;border-radius:8px;padding:9px 12px;font-size:14px;cursor:pointer}.choice.on{background:#eaf1ff;border-color:#709ef1;color:#124bb7;font-weight:700}.go{margin-top:20px;width:100%;border:0;border-radius:11px;background:var(--blue);padding:15px;color:#fff;font-size:16px;font-weight:800;cursor:pointer}.go:active{transform:scale(.99)}.result{display:none;margin-top:18px}.result.show{display:block}.notice{font-size:14px;line-height:1.65;color:#23503f;background:#eaf8f1;border-radius:10px;padding:12px 14px}.prompt{margin-top:12px;white-space:pre-wrap;line-height:1.65;background:#101a2e;color:#ecf3ff;border-radius:12px;padding:15px;font-size:14px;min-height:180px}.actions{display:flex;gap:10px;margin-top:12px}.actions button{flex:1;border-radius:9px;padding:11px;border:1px solid #bfcce0;background:#fff;color:#223450;font-weight:700;cursor:pointer}.actions button.primary{background:#15213a;color:#fff;border-color:#15213a}.toast{min-height:20px;margin-top:8px;color:var(--green);font-size:13px;text-align:center}@media(max-width:520px){.wrap{padding:16px 13px}.head,.box{padding:20px}.head h1{font-size:22px}}
  </style>
</head>
<body><main class="wrap">
  <section class="head"><h1>AI 短影音工作流</h1><p>輸入題材後交給 ChatGPT 真正創作；每次腳本、爆點與分鏡都會依題材重新生成。</p></section>
  <section class="box">
    <div class="step"><b class="n">1</b><span>輸入想做成短影音的題材。</span></div>
    <textarea id="topic" placeholder="例如：工廠冒白煙，真的就是污染嗎？"></textarea>
    <label>影片長度</label><div class="row" id="length"><button class="choice on" data-value="45">45 秒</button><button class="choice" data-value="60">60 秒</button></div>
    <label>影片風格</label><div class="row" id="style"><button class="choice on" data-value="懸疑反轉">懸疑反轉</button><button class="choice" data-value="知識科普">知識科普</button><button class="choice" data-value="職場共鳴">職場共鳴</button></div>
    <button class="go" id="make">一鍵交給 ChatGPT 生成</button>
  </section>
  <section class="box result" id="result"><div class="step"><b class="n">2</b><span>ChatGPT 已在新分頁開啟，貼上並送出即可。</span></div><div class="notice">創作任務已複製到剪貼簿。請在 ChatGPT 按一下輸入框後貼上（電腦：Ctrl／⌘ + V；手機：長按後貼上），再按送出。它會依你的題材產出不重複的腳本與分鏡。</div><div class="prompt" id="prompt"></div><div class="actions"><button id="copy" class="primary">再次複製創作任務</button></div><div class="toast" id="toast"></div></section>
</main>
<script>
  let seconds=45,style='懸疑反轉';
  function choose(id,set){document.getElementById(id).addEventListener('click',e=>{if(!e.target.matches('button'))return;[...e.currentTarget.children].forEach(x=>x.classList.remove('on'));e.target.classList.add('on');set(e.target.dataset.value)})}
  choose('length',v=>seconds=Number(v));choose('style',v=>style=v);
  function task(){return document.getElementById('prompt').innerText}
  function creativeBrief(topic){return `你是台灣短影音總導演與編劇。請針對以下題材，從零創作一支真正有差異化、可直接放進剪映「圖文生片」製作的短影音；不要套用固定模板，也不要重複常見句型。\n\n【題材】${topic}\n【片長】${seconds} 秒\n【風格】${style}\n【受眾】一般台灣觀眾\n\n請先自行找出這個題材最有張力、最具體且最容易引人留言的切角。內容必須使用台灣國語、白話自然，不編造未證實的事實；若題材資訊不足，請以合理情境呈現並標示為情境。\n\n請依序輸出：\n1. 一句最適合的影片標題。\n2. 0–3 秒的強力開場：畫面、字幕、口白。\n3. 完整口白：依片長控制節奏，有具體細節、轉折與記憶點。\n4. 6–8 個分鏡表：每鏡包含秒數、畫面描述、鏡頭動作、對應口白／字幕。分鏡必須貼合此題材，避免泛用「現場畫面、關鍵細節」等空話。\n5. 剪映圖文生片提示詞：一段完整可複製的視覺提示，說明台灣場景、人物一致性、光線、構圖與 9:16 直式；畫面內不要產生字幕或浮水印。\n6. 一句自然、不制式的留言 CTA。\n\n請讓每個段落都緊扣「${topic}」，並提供可立即拍攝或生成的具體內容。`}
  async function copyTask(message){try{await navigator.clipboard.writeText(task())}catch(e){const t=document.createElement('textarea');t.value=task();document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}document.getElementById('toast').textContent=message}
  document.getElementById('make').onclick=async()=>{const topic=document.getElementById('topic').value.trim();if(!topic){document.getElementById('topic').focus();return}document.getElementById('prompt').textContent=creativeBrief(topic);document.getElementById('result').classList.add('show');await copyTask('已複製並開啟 ChatGPT。');window.open('https://chatgpt.com/','_blank','noopener');document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'})};
  document.getElementById('copy').onclick=()=>copyTask('已再次複製；貼到 ChatGPT 後送出即可。');
</script></body></html>
