<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>一鍵短影音工作流</title>
  <style>
    :root{--blue:#155eef;--ink:#15213a;--muted:#637087;--paper:#f4f7fb;--line:#dce4f0}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.wrap{max-width:760px;margin:auto;padding:28px 18px 52px}.head{background:linear-gradient(135deg,#112c62,#1d5ece);padding:30px;border-radius:20px;color:white}.head h1{margin:0 0 8px;font-size:25px}.head p{margin:0;color:#dce9ff;line-height:1.6}.box{margin-top:18px;background:white;border:1px solid var(--line);border-radius:17px;padding:22px}.step{display:flex;gap:10px;margin:13px 0;color:var(--muted);font-size:14px}.n{width:25px;height:25px;flex:0 0 25px;display:grid;place-items:center;background:#e8efff;color:var(--blue);border-radius:50%;font-weight:800}label{font-weight:700;font-size:15px;display:block;margin:21px 0 8px}textarea{width:100%;min-height:100px;border:1px solid #bac7da;border-radius:11px;padding:13px;font:inherit;font-size:16px;line-height:1.5;resize:vertical}.row{display:flex;gap:8px;flex-wrap:wrap}.choice{border:1px solid #bfd0ed;background:#fff;color:#34435b;border-radius:8px;padding:9px 12px;font-size:14px;cursor:pointer}.choice.on{background:#eaf1ff;border-color:#709ef1;color:#124bb7;font-weight:700}.go{margin-top:20px;width:100%;border:0;border-radius:11px;background:var(--blue);padding:15px;color:#fff;font-size:16px;font-weight:800;cursor:pointer}.go:active{transform:scale(.99)}.result{display:none;margin-top:18px}.result.show{display:block}.tip{font-size:13px;line-height:1.65;color:var(--muted);background:#edf4ff;border-radius:10px;padding:11px 13px}.output{margin-top:12px;white-space:pre-wrap;line-height:1.65;background:#101a2e;color:#ecf3ff;border-radius:12px;padding:15px;font-size:14px;min-height:240px}.actions{display:flex;gap:10px;margin-top:12px}.actions button{flex:1;border-radius:9px;padding:11px;border:1px solid #bfcce0;background:#fff;color:#223450;font-weight:700;cursor:pointer}.actions button.primary{background:#15213a;color:#fff;border-color:#15213a}.toast{height:20px;margin-top:8px;color:#13845f;font-size:13px;text-align:center}@media(max-width:520px){.wrap{padding:16px 13px}.head,.box{padding:20px}.head h1{font-size:22px}}
  </style>
</head>
<body><main class="wrap">
  <section class="head"><h1>一鍵短影音工作流</h1><p>輸入一個主題，按一次按鈕，拿到可直接貼進剪映「圖文生片」的完整指令。</p></section>
  <section class="box">
    <div class="step"><b class="n">1</b><span>輸入你想講的題材。</span></div>
    <textarea id="topic" placeholder="例如：工廠冒白煙，真的就是污染嗎？"></textarea>
    <label>影片長度</label><div class="row" id="length"><button class="choice on" data-value="45">45 秒</button><button class="choice" data-value="60">60 秒</button></div>
    <label>影片風格</label><div class="row" id="style"><button class="choice on" data-value="懸疑反轉">懸疑反轉</button><button class="choice" data-value="知識科普">知識科普</button><button class="choice" data-value="職場共鳴">職場共鳴</button></div>
    <button class="go" id="make">一鍵產出剪映短影音包</button>
  </section>
  <section class="box result" id="result"><div class="step"><b class="n">2</b><span>複製下方內容，貼到剪映的「圖文生片」即可。</span></div><div class="tip">這個工具負責把想法整理成可用指令；影片會由剪映生成，因此不需要安裝或設定任何程式。</div><div class="output" id="output"></div><div class="actions"><button id="copy" class="primary">複製完整指令</button></div><div class="toast" id="toast"></div></section>
</main>
<script>
  let seconds=45,style='懸疑反轉';
  function choose(id,set){document.getElementById(id).addEventListener('click',e=>{if(!e.target.matches('button'))return;[...e.currentTarget.children].forEach(x=>x.classList.remove('on'));e.target.classList.add('on');set(e.target.dataset.value)})}
  choose('length',v=>seconds=Number(v));choose('style',v=>style=v);
  function text(){return document.getElementById('output').innerText}
  function packageText(topic){const hook=style==='懸疑反轉'?`「${topic}」你以為的答案，可能剛好相反。`:style==='知識科普'?`你真的了解「${topic}」嗎？${seconds} 秒看懂關鍵。`:`「${topic}」這件事，現場的人最有感。`;
return `請製作一支 ${seconds} 秒、9:16 直式、台灣國語口吻的短影音。\n\n【主題】\n${topic}\n\n【風格】\n${style}；節奏明快、寫實電影感、字幕清楚、不要英文口說。\n\n【前 3 秒爆點】\n${hook}\n\n【口白結構】\n1. 先用生活化問題引發好奇。\n2. 用白話說明真正關鍵，避免艱深術語。\n3. 用一個畫面對比呈現「原來如此」的反轉。\n4. 以一句容易記住的金句收尾。\n\n【分鏡】\n01｜強烈現場畫面＋問題字卡（0–3 秒）\n02｜主角或關鍵細節近景（3–12 秒）\n03｜用簡單動畫／對比解釋原因（12–30 秒）\n04｜證據或改善前後的反轉畫面（30–${seconds-8} 秒）\n05｜結論金句＋留言提問（最後 8 秒）\n\n【結尾 CTA】\n你對這件事的第一個想法是什麼？留言告訴我。\n\n【畫面規則】\n台灣真實場景、人物與服裝前後一致、畫面不要內建字幕或浮水印、保留後製字幕空間。`;}
  document.getElementById('make').onclick=()=>{const topic=document.getElementById('topic').value.trim();if(!topic){document.getElementById('topic').focus();return}document.getElementById('output').textContent=packageText(topic);document.getElementById('result').classList.add('show');document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'})};
  document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(text())}catch(e){const t=document.createElement('textarea');t.value=text();document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}document.getElementById('toast').textContent='已複製，現在開啟剪映並貼上即可。'};
</script></body></html>
