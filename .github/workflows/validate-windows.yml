name: Validate Windows Video Factory

on:
  push:
    paths:
      - 'windows_video_factory/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Build test MP4 on Windows PowerShell
        id: validation
        continue-on-error: true
        shell: powershell
        run: |
          .\windows_video_factory\TEST_WINDOWS.ps1 *>&1 | Tee-Object -FilePath windows_video_factory\validation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation-log
          path: windows_video_factory/validation.log
          if-no-files-found: error
      - name: Mark failed validation
        if: steps.validation.outcome != 'success'
        shell: powershell
        run: exit 1
